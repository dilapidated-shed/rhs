name: RHS grounding deterministic checks
on:
  pull_request:
  push:
    branches: [mean-what-you-say, sun/rhs-hungarian-grounding]
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/grounding-runtime
      - name: Execute pinned Flexible Pipes and Grease checks
        run: _ithon/ithon tests/hungarian_grounding/bootstrap.pi "$GITHUB_WORKSPACE" checks
      - name: Preserve checked source and stage receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhs-grounding-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: model-results
          if-no-files-found: error
          retention-days: 90
