name: RHS behavior evaluation
on:
  pull_request:
  push:
    branches: [mean-what-you-say]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ITHON_CHECK_RECEIPT: ${{ github.workspace }}/ithon-checks.jsonl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/rhs
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          path: work/rhs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: work/ithon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: cbcaa932bb26cada611096433dbf811f79cb9815
          path: work/flexible-pipes
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: ba7cf4d2844117ad8be97e97ffe8b9b1daa15012
          path: work/catfood
          persist-credentials: false
      - name: Check actual Ithon frontend
        shell: /home/runner/work/rhs/rhs/work/ithon/ithon /home/runner/work/rhs/rhs/work/rhs/examples/autogenerated/behavior-evaluation/ci.pi frontend {0}
        run: ${{ github.workspace }}/work
      - name: Preserve frontend receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhs-frontend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ithon-checks.jsonl
          if-no-files-found: error
  measured:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ITHON_CHECK_RECEIPT: ${{ github.workspace }}/ithon-checks.jsonl
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/rhs
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          path: work/rhs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: work/ithon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: cbcaa932bb26cada611096433dbf811f79cb9815
          path: work/flexible-pipes
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: ba7cf4d2844117ad8be97e97ffe8b9b1daa15012
          path: work/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ick
          ref: e3c2a40b4edafc4d9caca55d1f7c094e6aab9589
          path: work/ick
          submodules: recursive
          persist-credentials: false
      - name: Build, execute, measure and grade through Flexible Pipes
        shell: /home/runner/work/rhs/rhs/work/ithon/ithon /home/runner/work/rhs/rhs/work/rhs/examples/autogenerated/behavior-evaluation/ci.pi execute {0}
        run: ${{ github.workspace }}/work
      - name: Preserve exact execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhs-execution-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ithon-checks.jsonl
            work/evidence
            work/profile/*.tsv
            work/profile/*argv.txt
            work/profile/dependencies.txt
            work/provision
            work/pipeline-runs
          if-no-files-found: error
          retention-days: 90
