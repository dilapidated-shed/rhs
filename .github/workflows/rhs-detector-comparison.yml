name: RHS frozen detector comparison
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [qwen-1.5b, qwen-3b]
        presentation: [source, observations]
    env:
      GH_TOKEN: ${{ github.token }}
      ITHON_CHECK_RECEIPT: ${{ github.workspace }}/.detector-work/checked.jsonl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .detector-work/ithon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 90471095201bcabeb7ef920fa0101f4e667d1454
          path: .detector-work/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: a9aa38707c15f2909a40f226621dadf04010d7d9
          path: .detector-work/ai-ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: 3280a9f370d91298f959ffe0d367773ad74c799b
          path: .detector-work/kitchen
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: d88e90371f51254fb68a5d9128e5238c0b448de0
          path: .detector-work/flexible-pipes
          persist-credentials: false
      - name: Run frozen candidate and independent raw-response grading through FP
        shell: /home/runner/work/rhs/rhs/.detector-work/ithon/ithon /home/runner/work/rhs/rhs/examples/autogenerated/detector-comparison/ci.pi {0}
        run: |
          /home/runner/work/rhs/rhs
          ${{ matrix.model }}
          ${{ matrix.presentation }}
      - name: Retain exact comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhs-detector-${{ matrix.model }}-${{ matrix.presentation }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .detector-work/checked.jsonl
            .detector-work/comparison
            .detector-work/grading
            .detector-work/profile
            .detector-work/provision
            .detector-work/intake
            .detector-work/pipeline-runs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
