name: RHS native relations and independent evidence admission
on:
  pull_request:
  push:
    branches: [mean-what-you-say]
permissions:
  contents: read
  actions: read
jobs:
  native-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ITHON_CHECK_RECEIPT: ${{ github.workspace }}/.native-work/checked.jsonl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .native-work/ithon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 90471095201bcabeb7ef920fa0101f4e667d1454
          path: .native-work/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: a82d40bab9dc040e17bd420c11d9346f103262ad
          path: .native-work/ai-ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: 3613efd6c8550f4f7c70c27ee06c6e8ef8bb1051
          path: .native-work/kitchen
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: 133e0b5a4e04a928e1c8999a22bd153339e49856
          path: .native-work/flexible-pipes
          persist-credentials: false
      - name: Qualified pinned native compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@c789bb621ca9c5fb1a9bec07eb95cc670efb65f7
      - name: Execute native witnesses and independent recapture/admission through FP
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
          ICK_SOURCE_ROOT: ${{ github.workspace }}/.ick-host-source
        shell: /home/runner/work/rhs/rhs/.native-work/ithon/ithon /home/runner/work/rhs/rhs/examples/autogenerated/behavior-evaluation/native-ci.pi {0}
        run: /home/runner/work/rhs/rhs
      - name: Preserve exact native witnesses and independent acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhs-native-findings-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .native-work/checked.jsonl
            .native-work/evidence
            .native-work/profile
            .native-work/provision
            .native-work/pipeline-runs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
